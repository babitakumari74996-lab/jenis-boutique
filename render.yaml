# Render blueprint — client: Jeni's Boutique (Pollachi)
# STATIC SITE — no backend service block. This repo is a static frontend only.
# Do NOT copy this file into another client's repo — each client repo has its
# own Render service.

services:
  - type: static_site
    name: jenis-boutique
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    publishPath: dist
    branch: main
    envVars:
      # BUG 4.4: env var names are CASE-SENSITIVE on Render — keep these EXACTLY
      # as written (same names in .env.example and the Render dashboard).
      - key: VITE_SHOP_NAME
        value: Jeni's Boutique
      - key: VITE_SHOP_TAGLINE
        value: Sarees, chudithars, kurtas, lehengas, Western wear and customised clothing
      - key: VITE_SHOP_FOUNDED_YEAR
        value: "2010"
      - key: VITE_SHOP_LOGO_PATH
        value: /favicon.ico
      - key: VITE_WHATSAPP_NUMBER
        value: "919884619993"
      - key: VITE_INSTAGRAM_HANDLE
        value: jeni_s_boutique
      - key: VITE_CONTACT_EMAIL
        value: jenisboutique46@gmail.com
      - key: VITE_WEBSITE_URL
        value: https://jenis-boutique.in
      - key: VITE_GOOGLE_MAPS_URL
        value: "https://www.google.com/maps/search/?api=1&query=Jeni%27s+Boutique+119+Bazaar+Street+near+Lakshmi+Jewellery+Pollachi+Tamil+Nadu+642001"
      - key: VITE_GOOGLE_MAPS_EMBED_URL
        value: ""
      - key: VITE_SHOP_STREET
        value: "TS No. 119, Bazaar Street, near Lakshmi Jewellery"
      - key: VITE_SHOP_LOCALITY
        value: "Pollachi"
      - key: VITE_SHOP_CITY
        value: "Pollachi"
      - key: VITE_SHOP_REGION
        value: "Tamil Nadu"
      - key: VITE_SHOP_POSTAL
        value: "642001"
      - key: VITE_SHOP_HOURS
        value: "Monday – Saturday · 10 AM - 8 PM"